name: PlayerBlockShield
version: '1.0.1'
main: com.pbs.PlayerBlockShield
api-version: '1.20'
depend: [WorldGuard]
description: Cho phep nguoi choi chi pha cac block do nguoi choi dat xuong.
commands:
  pbs:
    description: Lenh quan tri PlayerBlockShield
    permission: pbs.admin
    usage: /<command> <reload|clear>
permissions:
  pbs.admin:
    description: Quyen dung lenh quan tri pbs
    default: op
  pbs.bypass:
    description: Quyen pha moi block va dat block map bat ke nguon goc
    default: op
